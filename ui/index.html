<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vector-hub · 向量检索控制台</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-panel: #161a23;
    --bg-card: #1b202c;
    --border: #262c3a;
    --text: #d7dce6;
    --text-dim: #8b93a5;
    --accent: #4f8cff;
    --accent-dim: #2c4a80;
    --good: #3fb96b;
    --warn: #d9a13c;
    --bad: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }
  header .logo { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
  header .logo span { color: var(--accent); }
  header .endpoint {
    font-family: Consolas, monospace; font-size: 12px; color: var(--text-dim);
    background: var(--bg); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 4px;
  }
  header .spacer { flex: 1; }
  header .health { font-size: 12px; color: var(--text-dim); }
  header .health .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 4px; }
  header .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  header .icon-btn:hover { color: var(--text); border-color: var(--accent); }

  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 280px; min-width: 280px; border-right: 1px solid var(--border);
    background: var(--bg-panel); display: flex; flex-direction: column;
  }
  aside .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  aside .head h2 { font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  aside .head button {
    background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px;
  }
  aside .head button:hover { text-decoration: underline; }
  #project-list { flex: 1; overflow-y: auto; padding: 8px; }
  .project {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 6px; margin-bottom: 2px;
  }
  .project:hover { background: var(--bg-card); }
  .project input[type=checkbox] { accent-color: var(--accent); }
  .project .name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project .count { font-size: 11px; color: var(--text-dim); }
  .project .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .project .watch-flag { font-size: 11px; color: var(--accent); flex-shrink: 0; }
  .project .del {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 13px; padding: 0 3px; border-radius: 3px; flex-shrink: 0;
  }
  .project .del:hover { color: var(--bad); }
  .dot.ok { background: var(--good); }
  .dot.empty { background: var(--text-dim); opacity: 0.4; }
  .dot.error { background: var(--bad); }
  aside .footer { padding: 10px; border-top: 1px solid var(--border); }
  aside .footer button {
    width: 100%; padding: 8px; background: var(--accent-dim); color: #cfe0ff;
    border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  aside .footer button:hover { background: var(--accent); color: #fff; }

  section.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .searchbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .searchbar input[type=text] {
    flex: 1; min-width: 300px; padding: 9px 14px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  }
  .searchbar input[type=text]:focus { outline: none; border-color: var(--accent); }
  .searchbar button.primary {
    padding: 9px 24px; background: var(--accent); color: #fff; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .searchbar button.primary:hover { background: #3d7aee; }
  .searchbar button.primary:disabled { background: var(--accent-dim); cursor: wait; }
  .searchbar .ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .searchbar input[type=range] { accent-color: var(--accent); width: 100px; }
  .searchbar input[type=checkbox] { accent-color: var(--accent); }
  .searchbar input[type=number] {
    width: 56px; padding: 5px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 12px;
  }

  .status {
    padding: 8px 20px; font-size: 12px; color: var(--text-dim);
    border-bottom: 1px solid var(--border); font-family: Consolas, monospace;
    min-height: 33px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .status .api { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }

  #results { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .placeholder { color: var(--text-dim); text-align: center; margin-top: 80px; font-size: 13px; line-height: 2; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .badge {
    font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 10px;
    font-family: Consolas, monospace;
  }
  .badge.hi { background: rgba(63,185,107,0.15); color: var(--good); }
  .badge.mid { background: rgba(217,161,60,0.15); color: var(--warn); }
  .badge.lo { background: rgba(139,147,165,0.15); color: var(--text-dim); }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--accent-dim); color: #cfe0ff;
  }
  .card .uri { font-size: 12px; color: var(--text-dim); font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .card .snippet { font-size: 13px; line-height: 1.7; color: var(--text); }
  .card .snippet mark { background: rgba(79,140,255,0.3); color: #fff; border-radius: 2px; padding: 0 2px; }
  .error-box {
    background: rgba(224,82,82,0.1); border: 1px solid var(--bad); color: #f0a0a0;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-size: 13px;
  }

  /* ---- modal ---- */
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 50; align-items: center; justify-content: center;
  }
  .modal-mask.open { display: flex; }
  .modal {
    width: 460px; max-width: calc(100vw - 40px); max-height: calc(100vh - 80px); overflow-y: auto;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 22px;
  }
  .modal h3 { font-size: 15px; margin-bottom: 14px; }
  .modal .field { margin-bottom: 12px; }
  .modal .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .modal .field input[type=text], .modal .field input[type=password], .modal .field select {
    width: 100%; padding: 8px 10px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  }
  .modal .field input:focus, .modal .field select:focus { outline: none; border-color: var(--accent); }
  .modal .field .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }
  .modal .check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; }
  .modal .check input { accent-color: var(--accent); }
  .modal .warn-box {
    background: rgba(217,161,60,0.12); border: 1px solid var(--warn); color: #e8c27a;
    border-radius: 6px; padding: 8px 12px; font-size: 12px; line-height: 1.6; margin-bottom: 12px;
  }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal .actions button {
    padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid var(--border);
    background: none; color: var(--text-dim);
  }
  .modal .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .modal .actions button:disabled { opacity: 0.5; cursor: wait; }
  .modal .progress-wrap { margin-top: 14px; display: none; }
  .modal .progress-wrap.show { display: block; }
  .modal .progress-text { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .modal .progress-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .modal .progress-bar .fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s; }
  .modal .error-text { color: var(--bad); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">vector<span>-hub</span> 控制台</div>
  <div class="endpoint">/api/search</div>
  <div class="spacer"></div>
  <div class="health" id="health"><span class="dot"></span>加载中…</div>
  <button class="icon-btn" id="settings-btn" title="Embedding 设置">⚙ 设置</button>
</header>
<main>
  <aside>
    <div class="head">
      <h2>项目</h2>
      <button id="toggle-all">全选</button>
    </div>
    <div id="project-list"><div class="placeholder">加载中…</div></div>
    <div class="footer">
      <button id="import-btn">📂 导入本地文件夹…</button>
    </div>
  </aside>
  <section class="content">
    <div class="searchbar">
      <input type="text" id="query" placeholder="输入自然语言问题，回车或点击搜索…" autofocus>
      <button class="primary" id="search-btn">搜索</button>
      <div class="ctrl">TopK <input type="number" id="topk" value="10" min="1" max="50"></div>
      <div class="ctrl">阈值 <input type="range" id="minscore" min="-1" max="1" step="0.05" value="0"><span id="minscore-val">0.00</span></div>
      <div class="ctrl"><input type="checkbox" id="bm25"> 混合搜索</div>
    </div>
    <div class="status" id="status">就绪 — UI 与 AI 共用同一检索接口</div>
    <div id="results"><div class="placeholder">输入问题开始检索<br>左侧勾选参与搜索的项目</div></div>
  </section>
</main>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settings-modal">
  <div class="modal">
    <h3>Embedding 模型设置</h3>
    <div class="field">
      <label>提供商</label>
      <select id="set-provider">
        <option value="minimax">MiniMax（embo-01，支持 Coding Plan 订阅 key）</option>
        <option value="openai">OpenAI 兼容（自定义 endpoint / 模型）</option>
      </select>
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="set-apikey" placeholder="sk-..." autocomplete="off">
      <div class="hint" id="set-apikey-hint">已配置的 key 只显示尾 4 位，保持不变可直接留空提交。</div>
    </div>
    <div class="field">
      <label>模型名（可选）</label>
      <input type="text" id="set-model" placeholder="默认 embo-01 / text-embedding-3-small">
    </div>
    <div class="field" id="set-endpoint-field" style="display:none">
      <label>Endpoint（OpenAI 兼容 base URL，不含 /v1）</label>
      <input type="text" id="set-endpoint" placeholder="https://api.siliconflow.cn">
    </div>
    <div class="warn-box">⚠ 切换模型会使现有索引的向量失效——保存后系统将从各项目的源文件夹自动重建索引；纯 API 写入、无源文件夹的项目需要手动重新导入。</div>
    <div class="actions">
      <button id="settings-cancel">取消</button>
      <button class="primary" id="settings-save">保存</button>
    </div>
    <div class="progress-wrap" id="rebuild-progress">
      <div class="progress-text" id="rebuild-text">重建中…</div>
      <div class="progress-bar"><div class="fill" id="rebuild-fill"></div></div>
      <div class="error-text" id="rebuild-errors"></div>
    </div>
  </div>
</div>

<!-- 导入确认弹窗 -->
<div class="modal-mask" id="import-modal">
  <div class="modal">
    <h3>导入本地文件夹</h3>
    <div class="field">
      <label>源文件夹路径</label>
      <input type="text" id="imp-source" placeholder="D:\path\to\notes">
      <div class="hint">支持 md / txt / html 文件；原文档不会被修改，索引是派生数据。</div>
    </div>
    <div class="field">
      <label>项目名</label>
      <input type="text" id="imp-name" placeholder="默认取文件夹名">
    </div>
    <div class="check">
      <input type="checkbox" id="imp-watch" checked>
      <label for="imp-watch" style="margin:0">持续同步（文件夹变化自动更新索引）</label>
    </div>
    <div class="actions">
      <button id="import-cancel">取消</button>
      <button class="primary" id="import-confirm">导入</button>
    </div>
    <div class="error-text" id="import-error"></div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const state = { projects: [], selected: new Set() };

  // ---------- generic helpers ----------
  async function api(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || ('HTTP ' + res.status)), { status: res.status });
    return data;
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- projects sidebar ----------
  async function loadProjects() {
    try {
      const data = await api('/api/projects');
      state.projects = data.projects || [];
      if (state.selected.size == 0) {
        state.projects.forEach(p => { if (p.hasIndex) state.selected.add(p.name); });
      }
      renderProjects();
      renderHealth();
    } catch (err) {
      $('project-list').innerHTML = '<div class="placeholder">加载失败：' + escapeHtml(err.message) + '</div>';
      setHealth('bad', '服务不可达');
    }
  }

  function renderProjects() {
    const list = $('project-list');
    list.innerHTML = '';
    if (state.projects.length == 0) {
      list.innerHTML = '<div class="placeholder">还没有项目<br>点击下方导入本地文件夹</div>';
      return;
    }
    for (const p of state.projects) {
      const row = document.createElement('label');
      row.className = 'project';
      const checked = state.selected.has(p.name) ? 'checked' : '';
      const dot = p.hasIndex ? 'ok' : 'empty';
      const tip = (p.hasIndex ? '索引正常' : '尚未建立索引') + (p.sourceDir ? '\n来源：' + p.sourceDir : '\nAPI 写入，无源文件夹');
      row.innerHTML =
        '<input type="checkbox" ' + checked + '>' +
        '<span class="dot ' + dot + '" title="' + escapeHtml(tip.split('\n')[0]) + '"></span>' +
        '<span class="name" title="' + escapeHtml(tip).replace(/\n/g, '&#10;') + '">' + escapeHtml(p.name) + '</span>' +
        (p.watching ? '<span class="watch-flag" title="持续同步中">⟳</span>' : '') +
        '<span class="count">' + p.docCount + ' 篇</span>' +
        '<button class="del" title="删除此项目索引（不动源文件夹）">×</button>';
      row.querySelector('input').addEventListener('change', (e) => {
        e.preventDefault();
        if (e.target.checked) state.selected.add(p.name); else state.selected.delete(p.name);
        renderProjects();
      });
      row.querySelector('.del').addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('删除项目 "' + p.name + '" 的索引？源文件夹不受影响。')) return;
        try {
          await api('/api/project?name=' + encodeURIComponent(p.name), { method: 'DELETE' });
          state.selected.delete(p.name);
          await loadProjects();
        } catch (err) { alert('删除失败：' + err.message); }
      });
      list.appendChild(row);
    }
    $('toggle-all').textContent = allSelected() ? '反选' : '全选';
  }

  $('toggle-all').addEventListener('click', () => {
    if (allSelected()) state.selected.clear();
    else state.projects.forEach(p => state.selected.add(p.name));
    renderProjects();
  });

  function allSelected() {
    return state.projects.length > 0 && state.projects.every(p => state.selected.has(p.name));
  }

  function renderHealth() {
    const bad = state.projects.filter(p => !p.hasIndex).length;
    if (state.projects.length == 0) setHealth('empty', '无项目');
    else if (bad == 0) setHealth('ok', state.projects.length + ' 个项目 · 索引全部正常');
    else setHealth('warn', state.projects.length + ' 个项目 · ' + bad + ' 个未建索引');
  }

  function setHealth(kind, text) {
    const color = kind == 'ok' ? 'var(--good)' : kind == 'warn' ? 'var(--warn)' : kind == 'empty' ? 'var(--text-dim)' : 'var(--bad)';
    $('health').innerHTML = '<span class="dot" style="background:' + color + '"></span>' + text;
  }

  // ---------- search ----------
  async function doSearch() {
    const q = $('query').value.trim();
    if (!q) return;
    const params = new URLSearchParams({ q });
    if (state.selected.size > 0) params.set('projects', [...state.selected].join(','));
    params.set('maxResults', $('topk').value || '10');
    params.set('minScore', $('minscore').value);
    if ($('bm25').checked) params.set('isBm25', 'true');

    const apiUrl = '/api/search?' + params.toString();
    $('status').innerHTML = '检索中… <span class="api">GET ' + escapeHtml(apiUrl) + '</span>';
    $('search-btn').disabled = true;

    try {
      const data = await api(apiUrl);
      renderResults(q, data, apiUrl);
    } catch (err) {
      $('results').innerHTML = '<div class="error-box">检索失败：' + escapeHtml(err.message) + '</div>';
      $('status').textContent = '检索失败';
    } finally {
      $('search-btn').disabled = false;
    }
  }

  function renderResults(q, data, apiUrl) {
    const boxes = [];
    for (const e of data.errors || []) {
      boxes.push('<div class="error-box">项目 <b>' + escapeHtml(e.project) + '</b> 检索出错：' + escapeHtml(e.message) + '</div>');
    }
    const skipped = (data.projectsSkipped || []).length
      ? '（跳过未建索引：' + escapeHtml(data.projectsSkipped.join(', ')) + '）' : '';
    if ((data.results || []).length == 0) {
      boxes.push('<div class="placeholder">没有命中结果<br>试着降低阈值或改写问题</div>');
    }
    data.results.forEach((r, i) => {
      const cls = r.score >= 0.5 ? 'hi' : r.score >= 0.3 ? 'mid' : 'lo';
      boxes.push(
        '<div class="card">' +
          '<div class="row1">' +
            '<span class="badge ' + cls + '">' + r.score.toFixed(4) + '</span>' +
            '<span class="chip">' + escapeHtml(r.project) + '</span>' +
            '<span class="uri">' + escapeHtml(r.uri) + '</span>' +
          '</div>' +
          '<div class="snippet">' + (i + 1) + '. ' + highlight(r.snippet, q) + '</div>' +
        '</div>'
      );
    });
    $('results').innerHTML = boxes.join('');
    $('status').innerHTML =
      '<span>' + (data.results || []).length + ' 条结果 · ' + data.tookMs + ' ms · 搜索 ' + (data.projectsSearched || []).length + ' 个项目' + skipped + '</span>' +
      '<span class="api" title="AI 调用同一接口">GET ' + escapeHtml(apiUrl) + '</span>';
  }

  function highlight(snippet, query) {
    const safe = escapeHtml(snippet);
    const terms = [...new Set(query.split(/\s+/).filter(t => t.length > 1))];
    if (terms.length == 0) return safe;
    const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
    try {
      return safe.replace(new RegExp('(' + pattern + ')', 'gi'), '<mark>$1</mark>');
    } catch {
      return safe;
    }
  }

  // ---------- settings modal ----------
  let rebuildPollTimer = null;

  $('settings-btn').addEventListener('click', async () => {
    try {
      const data = await api('/api/settings');
      $('set-provider').value = data.settings?.provider || 'minimax';
      $('set-apikey').value = data.settings?.apiKey || '';
      $('set-model').value = data.settings?.model || '';
      $('set-endpoint').value = data.settings?.endpoint || '';
      toggleEndpointField();
      $('rebuild-progress').classList.remove('show');
      $('settings-modal').classList.add('open');
    } catch (err) {
      alert('读取设置失败：' + err.message);
    }
  });

  function toggleEndpointField() {
    $('set-endpoint-field').style.display = $('set-provider').value == 'openai' ? '' : 'none';
  }
  $('set-provider').addEventListener('change', toggleEndpointField);
  $('settings-cancel').addEventListener('click', () => {
    clearInterval(rebuildPollTimer);
    $('settings-modal').classList.remove('open');
  });

  $('settings-save').addEventListener('click', async () => {
    const key = $('set-apikey').value.trim();
    if (!key) { alert('请填写 API Key（已配置且不变时可输入掩码值提交）。'); return; }
    $('settings-save').disabled = true;
    try {
      const data = await api('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          provider: $('set-provider').value,
          apiKey: key,
          model: $('set-model').value.trim() || undefined,
          endpoint: $('set-endpoint').value.trim() || undefined,
        }),
      });
      if (data.rebuildTriggered) {
        $('rebuild-progress').classList.add('show');
        pollRebuild();
      } else {
        clearInterval(rebuildPollTimer);
        $('settings-modal').classList.remove('open');
        await loadProjects();
      }
    } catch (err) {
      alert('保存失败：' + err.message);
    } finally {
      $('settings-save').disabled = false;
    }
  });

  function pollRebuild() {
    clearInterval(rebuildPollTimer);
    rebuildPollTimer = setInterval(async () => {
      try {
        const s = await api('/api/rebuild/status');
        const pct = s.total > 0 ? Math.round((s.done / s.total) * 100) : 100;
        $('rebuild-fill').style.width = pct + '%';
        $('rebuild-text').textContent = s.running
          ? '重建中：' + s.done + ' / ' + s.total + (s.currentProject ? '（' + s.currentProject + '）' : '')
          : '重建完成：' + s.done + ' / ' + s.total
            + (s.manual.length ? '；需手动处理：' + s.manual.join(', ') : '')
            + (s.errors.length ? '；' + s.errors.length + ' 个失败' : '');
        if (!s.running) {
          clearInterval(rebuildPollTimer);
          $('rebuild-errors').textContent = s.errors.map(e => e.project + ': ' + e.message).join('; ');
          await loadProjects();
        }
      } catch { /* transient */ }
    }, 800);
  }

  // ---------- import flow ----------
  $('import-btn').addEventListener('click', async () => {
    $('import-error').textContent = '';
    let picked = null;
    try {
      const data = await api('/api/system/pick-folder');
      picked = data.path;
    } catch (err) {
      if (err.status != 501 && err.status != 500) {
        alert('打开文件夹选择器失败：' + err.message);
        return;
      }
      // picker unavailable — fall through to manual entry
    }
    if (picked) {
      $('imp-source').value = picked;
      const seg = picked.split(/[\\/]/).filter(Boolean).pop() || '';
      $('imp-name').value = seg;
    } else {
      $('imp-source').value = '';
      $('imp-name').value = '';
    }
    $('import-modal').classList.add('open');
  });

  $('imp-source').addEventListener('input', () => {
    const seg = $('imp-source').value.split(/[\\/]/).filter(Boolean).pop() || '';
    if (seg) $('imp-name').value = seg;
  });

  $('import-cancel').addEventListener('click', () => $('import-modal').classList.remove('open'));
  $('import-confirm').addEventListener('click', async () => {
    const source = $('imp-source').value.trim();
    if (!source) { $('import-error').textContent = '请填写或选择源文件夹路径。'; return; }
    $('import-confirm').disabled = true;
    $('import-error').textContent = '导入中（首次需要向量化，可能耗时）…';
    try {
      const data = await api('/api/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sourceDir: source,
          projectName: $('imp-name').value.trim() || undefined,
          watch: $('imp-watch').checked,
        }),
      });
      $('import-modal').classList.remove('open');
      state.selected.add(data.project);
      await loadProjects();
      $('status').textContent = '已导入 "' + data.project + '"（' + data.filesTracked + ' 个文件被索引）';
    } catch (err) {
      $('import-error').textContent = '导入失败：' + err.message;
    } finally {
      $('import-confirm').disabled = false;
    }
  });

  // ---------- wiring ----------
  $('minscore').addEventListener('input', () => {
    $('minscore-val').textContent = Number($('minscore').value).toFixed(2);
  });
  $('search-btn').addEventListener('click', doSearch);
  $('query').addEventListener('keydown', (e) => { if (e.key == 'Enter') doSearch(); });

  loadProjects();
})();
</script>
</body>
</html>
