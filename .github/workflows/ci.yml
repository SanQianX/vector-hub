name: Non-release validation

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: non-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  core-windows:
    name: Core / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Runner TEMP uses 8.3 short paths (RUNNER~1); realpath-based
      # comparisons must see the expanded form. Use a workspace-local temp
      # dir, same as the project-knowledge-base CI.
      TEMP: ${{ github.workspace }}\.tmp
      TMP: ${{ github.workspace }}\.tmp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Prepare temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .tmp | Out-Null
      - name: Install, build, and test
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  vectra:
    name: Vendored vectra / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          # vectra keeps its own lockfile and node_modules; caching keyed on
          # the root lockfile does not apply here.
          package-manager-cache: false
      # The vendored fork installs strictly from its own tracked lockfile
      # into its own tree, so the root dependency versions cannot drift.
      - name: Install vendored vectra from its own lockfile
        run: npm ci --prefix packages/vectra
      - run: npm run build:vectra
      - run: npm run test:vectra
